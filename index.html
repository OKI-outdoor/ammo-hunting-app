<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#1f6f43">

  <title>実包・狩猟管理</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 0 80px 0;
      font-family: -apple-system,
                   BlinkMacSystemFont,
                   "Helvetica Neue",
                   sans-serif;
      background: #f3f5f4;
      color: #222;
    }


    /* ヘッダー */

    header {
      background: #1f6f43;
      color: white;
      padding: 18px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }


    /* メイン */

    main {
      padding: 14px;
      max-width: 600px;
      margin: auto;
    }


    /* カード */

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.07);
    }


    .card h2 {
      margin: 0 0 16px 0;
      font-size: 19px;
    }


    /* 在庫 */

    .stock-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .stock-item:last-child {
      border-bottom: none;
    }

    .stock-name {
      font-size: 16px;
    }

    .stock-number {
      font-size: 21px;
      font-weight: bold;
      color: #1f6f43;
    }


    /* ボタン */

    button {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-button {
      background: #1f6f43;
      color: white;
    }

    .main-button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .secondary-button {
      background: #e8eee9;
      color: #1f6f43;
    }


    /* 入力 */

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 15px;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 50px;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      font-size: 17px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }


    /* 2列 */

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }


    /* 金額 */

    .total-box {
      background: #f1f7f3;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
    }

    .total-label {
      font-size: 14px;
      color: #666;
    }

    .total-value {
      font-size: 24px;
      font-weight: bold;
      color: #1f6f43;
      margin-top: 4px;
    }


    /* ステータス */

    #status {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin: 8px 0 14px;
    }


    /* 画面切替 */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }


    /* 下部メニュー */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: white;
      border-top: 1px solid #ddd;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      z-index: 20;
    }

    .bottom-nav button {
      min-height: 64px;
      border-radius: 0;
      background: white;
      color: #666;
      font-size: 13px;
    }

    .bottom-nav button.active {
      color: #1f6f43;
      font-weight: bold;
    }


    .hidden {
      display: none;
    }

    #buyReceipt {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 8px;
  font-size: 16px;
}
  </style>

</head>


<body>


<header>

  <h1>実包・狩猟管理</h1>

</header>


<main>


  <div id="status">
    データ読み込み中…
  </div>


  <!-- ====================== -->
  <!-- ホーム -->
  <!-- ====================== -->

  <section
    id="homePage"
    class="page active"
  >

    <div class="card">

      <h2>現在庫</h2>

      <div id="stock">
        読み込み中…
      </div>

    </div>


    <div class="card">

      <h2>記録</h2>

      <button
        class="main-button"
        onclick="showPage('buyPage')"
      >
        ＋ 購入を記録
      </button>

      <div style="height:10px;"></div>

      <button
        class="secondary-button"
        onclick="alert('使用記録は次の段階で追加します。')"
      >
        − 使用を記録
      </button>

    </div>


    <div class="card">

      <h2>登録情報</h2>

      <p>
        弾種：
        <strong id="ammoCount">-</strong>
      </p>

      <p>
        銃砲：
        <strong id="gunCount">-</strong>
      </p>

      <p>
        鳥獣：
        <strong id="animalCount">-</strong>
      </p>

    </div>

  </section>


  <!-- ====================== -->
  <!-- 購入 -->
  <!-- ====================== -->

  <section
    id="buyPage"
    class="page"
  >

    <div class="card">

      <h2>購入記録</h2>


      <label for="buyDate">
        日付
      </label>

      <input
        type="date"
        id="buyDate"
      >


      <label for="buyType">
        弾種
      </label>

      <select id="buyType">

        <option value="">
          選択してください
        </option>

      </select>


      <label for="buyQty">
        数量
      </label>

      <input
        type="number"
        id="buyQty"
        inputmode="numeric"
        min="1"
        placeholder="例：50"
      >


      <label for="buyPurpose">
        目的
      </label>

      <select id="buyPurpose">

        <option value="狩猟">
          狩猟
        </option>

        <option value="標的射撃">
          標的射撃
        </option>

        <option value="有害鳥獣捕獲">
          有害鳥獣捕獲
        </option>

      </select>


      <label for="buyGun">
        使用銃砲
      </label>

      <select id="buyGun">

        <option value="">
          選択してください
        </option>

      </select>


      <label for="buyPlace">
        入手先・場所
      </label>

      <input
        type="text"
        id="buyPlace"
        placeholder="例：小宮銃砲火薬店"
      >


      <div class="two-column">

        <div>

          <label for="buyUnitPrice">
            単価（円）
          </label>

          <input
            type="number"
            id="buyUnitPrice"
            inputmode="numeric"
            min="0"
            placeholder="例：500"
          >

        </div>


        <div>

          <div class="total-box">

            <div class="total-label">
              金額
            </div>

            <div
              id="buyTotal"
              class="total-value"
            >
              0円
            </div>

          </div>

        </div>

      </div>


      <label for="buyNote">
        備考
      </label>

      <textarea
        id="buyNote"
        placeholder="必要に応じて入力"
      ></textarea>

      <label for="buyReceipt">
        レシート
      </label>

        <input
          type="file"
          id="buyReceipt"
          accept="image/*"
          capture="environment"
        >


      <div style="height:20px;"></div>


      <button
        id="buySaveButton"
        class="main-button"
        onclick="saveBuy()"
      >
        購入記録を保存
      </button>


      <div style="height:10px;"></div>


      <button
        class="secondary-button"
        onclick="showPage('homePage')"
      >
        キャンセル
      </button>

    </div>

  </section>


</main>


<!-- ====================== -->
<!-- 下部メニュー -->
<!-- ====================== -->

<nav class="bottom-nav">

  <button
    id="homeTab"
    class="active"
    onclick="showPage('homePage')"
  >
    🏠<br>
    ホーム
  </button>


  <button
    onclick="showPage('buyPage')"
  >
    ＋<br>
    購入
  </button>


  <button
    onclick="alert('履歴・集計は次の段階で追加します。')"
  >
    ☰<br>
    その他
  </button>

</nav>


<script>


  // =================================
  // API
  // =================================

  const API_URL =
    'https://ammo-gas-api.kikorinmura.workers.dev/?api=data';


  let appData = null;


  // =================================
  // 初期表示
  // =================================

  loadData();


  function loadData() {

    document.getElementById('status')
      .textContent =
      'データ読み込み中…';


    fetch(API_URL)

      .then(function(response) {

        if (!response.ok) {

          throw new Error(
            'HTTPエラー: ' +
            response.status
          );

        }

        return response.json();

      })

      .then(function(data) {

        appData = data;

        renderAll();

        document.getElementById('status')
          .textContent =
          '最新データを読み込みました';

      })

      .catch(function(error) {

        console.error(error);

        document.getElementById('status')
          .textContent =
          'データ読み込みエラー';

        alert(
          'データの読み込みに失敗しました\n' +
          error.message
        );

      });

  }


  // =================================
  // 全体表示
  // =================================

  function renderAll() {

    renderStock();

    renderAmmoTypes();

    renderGuns();

    renderCounts();

    setToday();

  }


  // =================================
  // 在庫
  // =================================

  function renderStock() {

    const element =
      document.getElementById('stock');

    element.innerHTML = '';


    if (
      !appData ||
      !appData.stock
    ) {

      element.textContent =
        '在庫データがありません';

      return;

    }


    const keys =
      Object.keys(appData.stock);


    if (keys.length === 0) {

      element.textContent =
        '在庫データがありません';

      return;

    }


    keys.forEach(function(type) {

      const row =
        document.createElement('div');

      row.className =
        'stock-item';


      const name =
        document.createElement('span');

      name.className =
        'stock-name';

      name.textContent =
        type;


      const quantity =
        document.createElement('span');

      quantity.className =
        'stock-number';

      quantity.textContent =
        appData.stock[type] +
        ' 発';


      row.appendChild(name);

      row.appendChild(quantity);

      element.appendChild(row);

    });

  }


  // =================================
  // 弾種
  // =================================

  function renderAmmoTypes() {

    const select =
      document.getElementById('buyType');

    select.innerHTML = '';

    const first =
      document.createElement('option');

    first.value = '';

    first.textContent =
      '選択してください';

    select.appendChild(first);


    if (
      !appData ||
      !appData.ammoTypes
    ) {
      return;
    }


    appData.ammoTypes.forEach(
      function(name) {

        const option =
          document.createElement('option');

        option.value =
          name;

        option.textContent =
          name;

        select.appendChild(option);

      }
    );

  }


  // =================================
  // 銃砲
  // =================================

  function renderGuns() {

    const select =
      document.getElementById('buyGun');

    select.innerHTML = '';


    const first =
      document.createElement('option');

    first.value = '';

    first.textContent =
      '選択してください';

    select.appendChild(first);


    if (
      !appData ||
      !appData.guns
    ) {
      return;
    }


    appData.guns.forEach(
      function(gun) {

        const option =
          document.createElement('option');

        option.value =
          gun.name;

        option.textContent =
          gun.name +
          '（' +
          gun.caliber +
          '）';

        select.appendChild(option);

      }
    );

  }


  // =================================
  // 件数
  // =================================

  function renderCounts() {

    document.getElementById('ammoCount')
      .textContent =
      appData.ammoTypes
        ? appData.ammoTypes.length
        : 0;

    document.getElementById('gunCount')
      .textContent =
      appData.guns
        ? appData.guns.length
        : 0;

    document.getElementById('animalCount')
      .textContent =
      appData.animals
        ? appData.animals.length
        : 0;

  }


  // =================================
  // 今日の日付
  // =================================

  function setToday() {

    const input =
      document.getElementById('buyDate');

    if (input.value) {
      return;
    }


    const now =
      new Date();


    const yyyy =
      now.getFullYear();


    const mm =
      String(
        now.getMonth() + 1
      ).padStart(2,'0');


    const dd =
      String(
        now.getDate()
      ).padStart(2,'0');


    input.value =
      yyyy + '-' +
      mm + '-' +
      dd;

  }


  // =================================
  // 金額計算
  // =================================

  document.getElementById('buyQty')
    .addEventListener(
      'input',
      calculateTotal
    );


  document.getElementById('buyUnitPrice')
    .addEventListener(
      'input',
      calculateTotal
    );


  function calculateTotal() {

    const qty =
      Number(
        document.getElementById(
          'buyQty'
        ).value || 0
      );


    const unitPrice =
      Number(
        document.getElementById(
          'buyUnitPrice'
        ).value || 0
      );


    const total =
      qty * unitPrice;


    document.getElementById('buyTotal')
      .textContent =
      total.toLocaleString() +
      '円';

  }


  // =================================
  // 購入保存
  // =================================

  function saveBuy() {

    const button =
      document.getElementById(
        'buySaveButton'
      );


    if (button.disabled) {
      return;
    }


    const date =
      document.getElementById(
        'buyDate'
      ).value;


    const type =
      document.getElementById(
        'buyType'
      ).value;


    const qty =
      Number(
        document.getElementById(
          'buyQty'
        ).value || 0
      );


    const purpose =
      document.getElementById(
        'buyPurpose'
      ).value;


    const gun =
      document.getElementById(
        'buyGun'
      ).value;


    const place =
      document.getElementById(
        'buyPlace'
      ).value;


    const unitPrice =
      Number(
        document.getElementById(
          'buyUnitPrice'
        ).value || 0
      );


    const total =
      qty * unitPrice;


    const note =
      document.getElementById(
        'buyNote'
      ).value;


    // 入力チェック

    if (!date) {

      alert('日付を入力してください。');

      return;

    }


    if (!type) {

      alert('弾種を選択してください。');

      return;

    }


    if (qty <= 0) {

      alert('数量を入力してください。');

      return;

    }


    if (!gun) {

      alert('使用銃砲を選択してください。');

      return;

    }


    if (unitPrice < 0) {

      alert('単価を確認してください。');

      return;

    }


    const record = {

      recordId:
        'BUY-' +
        Date.now() +
        '-' +
        Math.random()
          .toString(36)
          .substring(2,10),

      date: date,

      kind: '購入',

      type: type,

      qty: qty,

      purpose: purpose,

      gun: gun,

      place: place,

      unitPrice: unitPrice,

      total: total,

      note: note

    };


    // 二重登録防止

    button.disabled = true;

    button.textContent =
      '保存中…';


    fetch(
      API_URL,
      {
        method: 'POST',

        headers: {
          'Content-Type':
            'application/json'
        },

        body:
          JSON.stringify(record)

      }
    )

    .then(function(response) {

      if (!response.ok) {

        throw new Error(
          'HTTPエラー: ' +
          response.status
        );

      }

      return response.json();

    })

    .then(function(data) {

      if (!data.success) {

        throw new Error(
          data.error ||
          '保存に失敗しました'
        );

      }


      // GASから返ってきた最新データ
      appData =
        data.data;


      renderAll();


      // 入力クリア

      document.getElementById(
        'buyQty'
      ).value = '';

      document.getElementById(
        'buyPlace'
      ).value = '';

      document.getElementById(
        'buyUnitPrice'
      ).value = '';

      document.getElementById(
        'buyNote'
      ).value = '';

      calculateTotal();


      alert(
        '購入記録を保存しました。'
      );


      showPage('homePage');

    })

    .catch(function(error) {

      console.error(error);

      alert(
        '購入記録の保存に失敗しました。\n' +
        error.message
      );

    })

    .finally(function() {

      button.disabled = false;

      button.textContent =
        '購入記録を保存';

    });

  }


  // =================================
  // ページ切替
  // =================================

  function showPage(pageId) {

    document
      .querySelectorAll('.page')
      .forEach(
        function(page) {

          page.classList.remove(
            'active'
          );

        }
      );


    const page =
      document.getElementById(
        pageId
      );


    if (page) {

      page.classList.add(
        'active'
      );

    }


    document
      .querySelectorAll(
        '.bottom-nav button'
      )
      .forEach(
        function(button) {

          button.classList.remove(
            'active'
          );

        }
      );


    if (pageId === 'homePage') {

      document.getElementById(
        'homeTab'
      ).classList.add(
        'active'
      );

    }


    window.scrollTo(0,0);

  }


</script>

</body>

</html>
