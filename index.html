<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#1f6f43">

  <title>実包・狩猟管理</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 0 80px 0;
      font-family: -apple-system,
                   BlinkMacSystemFont,
                   "Helvetica Neue",
                   sans-serif;
      background: #f3f5f4;
      color: #222;
    }


    /* ヘッダー */

    header {
      background: #1f6f43;
      color: white;
      padding: 18px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }


    /* メイン */

    main {
      padding: 14px;
      max-width: 600px;
      margin: auto;
    }


    /* カード */

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.07);
    }


    .card h2 {
      margin: 0 0 16px 0;
      font-size: 19px;
    }


    /* 在庫 */

    .stock-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .stock-item:last-child {
      border-bottom: none;
    }

    .stock-name {
      font-size: 16px;
    }

    .stock-number {
      font-size: 21px;
      font-weight: bold;
      color: #1f6f43;
    }


    /* ボタン */

    button {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-button {
      background: #1f6f43;
      color: white;
    }

    .main-button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .secondary-button {
      background: #e8eee9;
      color: #1f6f43;
    }


    /* 入力 */

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 15px;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 50px;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      font-size: 17px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }


    /* 2列 */

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }


    /* 金額 */

    .total-box {
      background: #f1f7f3;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
    }

    .total-label {
      font-size: 14px;
      color: #666;
    }

    .total-value {
      font-size: 24px;
      font-weight: bold;
      color: #1f6f43;
      margin-top: 4px;
    }


    /* ステータス */

    #status {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin: 8px 0 14px;
    }


    /* 画面切替 */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }


  /* 下部メニュー */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 64px;
  background: white;
  border-top: 1px solid #ddd;
  display: grid;

  /* 5ボタン対応 */
  grid-template-columns: repeat(5, 1fr);

  z-index: 20;
}

.bottom-nav button {
  min-height: 64px;
  border-radius: 0;
  background: white;
  color: #666;

  /* 5個でも見やすいサイズ */
  font-size: 12px;

  padding: 4px 2px;
}

.bottom-nav button.active {
  color: #1f6f43;
  font-weight: bold;
}


    .hidden {
      display: none;
    }

    #buyReceipt {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 8px;
  font-size: 16px;
}
  </style>

</head>

<script>


  // =================================
  // API
  // =================================

  const API_URL =
    'https://ammo-gas-api.kikorinmura.workers.dev/?api=data';


  let appData = null;


  // =================================
  // 初期表示
  // =================================

  loadData();


  function loadData() {

    document.getElementById('status')
      .textContent =
      'データ読み込み中…';


    fetch(API_URL)

      .then(function(response) {

        if (!response.ok) {

          throw new Error(
            'HTTPエラー: ' +
            response.status
          );

        }

        return response.json();

      })

      .then(function(data) {

        appData = data;

        renderAll();

        document.getElementById('status')
          .textContent =
          '最新データを読み込みました';

      })

      .catch(function(error) {

        console.error(error);

        document.getElementById('status')
          .textContent =
          'データ読み込みエラー';

        alert(
          'データの読み込みに失敗しました\n' +
          error.message
        );

      });

  }


  // =================================
  // 全体表示
  // =================================

  function renderAll() {

  renderStock();

  renderAmmoTypes();

  renderGuns();

  renderAnimalsForUse();

  renderCounts();

  renderHistory();

  renderFiscalYears();

  setToday();

}


  // =================================
  // 動物アイコン
  // =================================
  
function getAnimalIcon(animalName) {

  const name =
    String(animalName || '');

  if (name.includes('エゾシカ')) {
    return '🦌';
  }

  if (
    name.includes('カモ') ||
    name.includes('鴨')
  ) {
    return '🦆';
  }

  if (
    name.includes('ヒグマ') ||
    name.includes('クマ')
  ) {
    return '🐻';
  }

  if (
    name.includes('キツネ') ||
    name.includes('狐')
  ) {
    return '🦊';
  }

  if (
    name.includes('イノシシ') ||
    name.includes('猪')
  ) {
    return '🐗';
  }

  return '🐾';
}

  // =================================
  // 履歴
  // =================================

function renderFiscalYears() {

  const select =
    document.getElementById('summaryFiscalYear');

  if (!select) {
    return;
  }

  select.innerHTML = '';


  if (
    !appData ||
    !appData.fiscalYears ||
    appData.fiscalYears.length === 0
  ) {

    const option =
      document.createElement('option');

    option.value = '';
    option.textContent = '年度データなし';

    select.appendChild(option);

    return;
  }


  appData.fiscalYears.forEach(
    function(year) {

      const option =
        document.createElement('option');

      option.value = year;
      option.textContent =
        year + '年度';

      select.appendChild(option);

    }
  );


  // 最新年度を初期選択
select.value =
  appData.fiscalYears[0];

// 年度を変更したとき
select.onchange =
  function() {
    renderFiscalSummary();
  };

// 初期表示
renderFiscalSummary();

}

  function renderFiscalSummary() {

  const select =
    document.getElementById(
      'summaryFiscalYear'
    );

  const content =
    document.getElementById(
      'summaryContent'
    );

  if (
    !select ||
    !content ||
    !appData ||
    !appData.records
  ) {
    return;
  }


  const year =
    Number(select.value);

  if (!year) {

    content.innerHTML =
      '<p>年度を選択してください。</p>';

    return;
  }


  let purchases = 0;
  let uses = 0;
  let purchaseTotal = 0;
  let openingStock = 0;
  let initialStock = 0;


  appData.records.forEach(
    function(record) {

      const recordYear =
        Number(
          record['年度'] || 0
        );

      const kind =
        String(
          record['区分'] || ''
        );

      const qty =
        Number(
          record['数量'] || 0
        );

      const amount =
        Number(
          record['金額'] || 0
        );


      // 過去年度 → 期首在庫
      if (recordYear < year) {

        if (
          kind === '初期在庫' ||
          kind === '購入'
        ) {
          openingStock += qty;
        }

        if (kind === '使用') {
          openingStock -= qty;
        }

      }


      // 選択年度
      if (recordYear === year) {

        if (kind === '初期在庫') {
          initialStock += qty;
        }

        if (kind === '購入') {
          purchases += qty;
          purchaseTotal += amount;
        }

        if (kind === '使用') {
          uses += qty;
        }

      }

    }
  );


  const closingStock =
    openingStock +
    initialStock +
    purchases -
    uses;

    const ammoSummary = {};

appData.records.forEach(
  function(record) {

    const recordYear =
      Number(
        record['年度'] || 0
      );

    const type =
      String(
        record['弾種'] || ''
      );

    const kind =
      String(
        record['区分'] || ''
      );

    const qty =
      Number(
        record['数量'] || 0
      );


    if (!type) {
      return;
    }


    if (!ammoSummary[type]) {

      ammoSummary[type] = {
        opening: 0,
        purchase: 0,
        use: 0,
        closing: 0
      };

    }


    // 前年度までの在庫
    if (recordYear < year) {

      if (
        kind === '初期在庫' ||
        kind === '購入'
      ) {
        ammoSummary[type].opening += qty;
      }

      if (kind === '使用') {
        ammoSummary[type].opening -= qty;
      }

    }


    // 選択年度
    if (recordYear === year) {

      if (
        kind === '初期在庫' ||
        kind === '購入'
      ) {

        ammoSummary[type].purchase += qty;

      }

      if (kind === '使用') {

        ammoSummary[type].use += qty;

      }

    }

  }
);


// 期末在庫を計算
Object.keys(ammoSummary)
  .forEach(function(type) {

    ammoSummary[type].closing =
      ammoSummary[type].opening +
      ammoSummary[type].purchase -
      ammoSummary[type].use;

  });

  // =================================
// 譲受理由別集計
// =================================

const purchaseReasonSummary = {};

appData.records.forEach(
  function(record) {

    const recordYear =
      Number(
        record['年度'] || 0
      );

    const kind =
      String(
        record['区分'] || ''
      );

    if (
      recordYear !== year ||
      kind !== '購入'
    ) {
      return;
    }


    let reason =
      String(
        record['譲受理由'] || ''
      ).trim();

    if (!reason) {
      reason = '未設定';
    }


    const qty =
      Number(
        record['数量'] || 0
      );

    const amount =
      Number(
        record['金額'] || 0
      );


    if (!purchaseReasonSummary[reason]) {

      purchaseReasonSummary[reason] = {
        count: 0,
        qty: 0,
        amount: 0
      };

    }


    purchaseReasonSummary[reason].count += 1;

    purchaseReasonSummary[reason].qty += qty;

    purchaseReasonSummary[reason].amount += amount;

  }

  };


  console.log(
    '送信する使用記録:',
    JSON.stringify(
      record,
      null,
      2
    )
  );


  button.textContent =
    '保存中…';


  return fetch(
    API_URL,
    {
      method: 'POST',

      headers: {
        'Content-Type':
          'application/json'
      },

      body:
        JSON.stringify(record)
    }
  );

})

.then(function(response) {

  if (!response.ok) {

    throw new Error(
      'HTTPエラー: ' +
      response.status
    );
  }

  return response.json();

})

.then(function(data) {

  if (!data.success) {

    throw new Error(
      data.error ||
      '保存に失敗しました'
    );
  }


  // GASから返ってきた最新データ
  appData =
    data.data;


  renderAll();


  // 使用記録をクリア
  document.getElementById(
    'useQty'
  ).value = '';

  document.getElementById(
    'usePlace'
  ).value = '';

  document.getElementById(
    'useNote'
  ).value = '';


  // 捕獲情報をクリア
  document.getElementById(
    'captureAnimal'
  ).value = '';

  document.getElementById(
    'captureCount'
  ).value = '';

  document.getElementById(
    'capturePhoto'
  ).value = '';

  // GPS情報をクリア
document.getElementById(
  'captureLatitude'
).textContent = '';

document.getElementById(
  'captureLongitude'
).textContent = '';

document.getElementById(
  'captureGpsTime'
).textContent = '';

document.getElementById(
  'gpsStatus'
).style.display = 'none';
  
  // 写真プレビューを消す
  document.getElementById(
    'capturePhotoPreview'
  ).style.display = 'none';

  document.getElementById(
    'capturePhotoImage'
  ).src = '';


  alert(
    '使用記録を保存しました。'
  );


  showPage(
    'homePage'
  );

})

.catch(function(error) {

  console.error(error);

  alert(
    '使用記録の保存に失敗しました。\n' +
    error.message
  );

})

.finally(function() {

  button.disabled = false;

  button.textContent =
    '使用記録を保存';

});

}

  const section =
    document.getElementById('captureSection');

  if (!section) {
    return;
  }

  if (
    purpose === '狩猟' ||
    purpose === '有害鳥獣捕獲'
  ) {

    section.style.display = 'block';

 } else {

  section.style.display = 'none';

  clearCaptureInputs();

}
}
function clearCaptureInputs() {

  const preview =
    document.getElementById('capturePhotoPreview');

function getCaptureGPS() {
  const button = document.getElementById('gpsButton');
  const status = document.getElementById('gpsStatus');

  if (!navigator.geolocation) {
    alert('この端末ではGPSを利用できません。');
    return;
  }

  button.disabled = true;
  button.textContent = '📍 現在地を取得中…';

  navigator.geolocation.getCurrentPosition(
    function(position) {

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const gpsTime = new Date().toISOString();

      document.getElementById('captureLatitude').textContent =
        latitude.toFixed(6);

      document.getElementById('captureLongitude').textContent =
        longitude.toFixed(6);

      document.getElementById('captureGpsTime').textContent =
        new Date(gpsTime).toLocaleString('ja-JP');

      status.style.display = 'block';

      button.disabled = false;
      button.textContent = '📍 現在地を取得';

    },
    function(error) {

      let message = 'GPSの取得に失敗しました。';

      if (error.code === 1) {
        message += '\n位置情報の利用を許可してください。';
      } else if (error.code === 2) {
        message += '\n現在地を取得できませんでした。';
      } else if (error.code === 3) {
        message += '\nGPS取得がタイムアウトしました。';
      }

      alert(message);

      button.disabled = false;
      button.textContent = '📍 現在地を取得';

    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}
  
  // =================================
  // ページ切替
  // =================================

  function showPage(pageId) {

    document
      .querySelectorAll('.page')
      .forEach(
        function(page) {

          page.classList.remove(
            'active'
          );

        }
      );


    const page =
      document.getElementById(
        pageId
      );


    if (page) {

      page.classList.add(
        'active'
      );

    }


    document
      .querySelectorAll(
        '.bottom-nav button'
      )
      .forEach(
        function(button) {

          button.classList.remove(
            'active'
          );

        }
      );


    if (pageId === 'homePage') {

      document.getElementById(
        'homeTab'
      ).classList.add(
        'active'
      );

    }


    window.scrollTo(0,0);

  }

  document
  .getElementById('buyReceipt')
  .addEventListener('change', function() {

    const file = this.files[0];

    const preview =
      document.getElementById('buyReceiptPreview');

    const image =
      document.getElementById('buyReceiptImage');

    if (!file) {
      preview.style.display = 'none';
      image.src = '';
      return;
    }

    const reader =
      new FileReader();

    reader.onload = function(e) {

      image.src = e.target.result;

      preview.style.display = 'block';

    };

    reader.readAsDataURL(file);

  });

  // =========================
// 捕獲写真のプレビュー
// =========================
  
  document
  .getElementById('capturePhoto')
  .addEventListener('change', function() {

    const file = this.files[0];

    const preview =
      document.getElementById('capturePhotoPreview');

    const image =
      document.getElementById('capturePhotoImage');

    if (!file) {
      preview.style.display = 'none';
      image.src = '';
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
      image.src = e.target.result;
      preview.style.display = 'block';
    };

    reader.readAsDataURL(file);
  });

  function imageToDataUrl(
  file,
  maxSize,
  quality
) {

  return new Promise(function(
    resolve,
    reject
  ) {

    // レシートなしなら空文字
    if (!file) {
      resolve('');
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(event) {

        const image =
          new Image();


        image.onload =
          function() {

            let width =
              image.width;

            let height =
              image.height;


            if (
              width > maxSize ||
              height > maxSize
            ) {

              if (width > height) {

                height =
                  Math.round(
                    height *
                    maxSize /
                    width
                  );

                width =
                  maxSize;

              } else {

                width =
                  Math.round(
                    width *
                    maxSize /
                    height
                  );

                height =
                  maxSize;

              }

            }


            const canvas =
              document.createElement(
                'canvas'
              );


            canvas.width =
              width;

            canvas.height =
              height;


            const context =
              canvas.getContext(
                '2d'
              );


            context.drawImage(
              image,
              0,
              0,
              width,
              height
            );


            const dataUrl =
              canvas.toDataURL(
                'image/jpeg',
                quality
              );


            resolve(dataUrl);

          };


        image.onerror =
          function() {

            reject(
              new Error(
                'レシート画像を読み込めませんでした。'
              )
            );

          };


        image.src =
          event.target.result;

      };


    reader.onerror =
      function() {

        reject(
          new Error(
            'レシート画像の読み込みに失敗しました。'
          )
        );

      };


    reader.readAsDataURL(file);

  });

}
