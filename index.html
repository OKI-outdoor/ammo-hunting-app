```html
<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>実包・狩猟管理</title>

</head>

<body>

  <h1>実包・狩猟管理</h1>

  <h2>現在庫</h2>

  <div id="stock">
    読み込み中…
  </div>


  <script>

    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbzRtkR5QMaKLnkxtJsN2qnmQxbCYY0qqtd77c7hKFSXuOx_3XDHDnl0C5jsYSrCuAl1/exec';


  window.gasDataCallback =
    function(data) {

      alert(
        'GASからデータを受信しました！'
      );

      document.getElementById('stock')
        .textContent =
        JSON.stringify(data, null, 2);

    };


  const script =
    document.createElement('script');


  script.src =
    GAS_URL +
    '?api=jsonp&callback=gasDataCallback&_=' +
    Date.now();


  script.onload =
    function() {

      alert(
        'GASのスクリプトを読み込みました'
      );

    };


  script.onerror =
    function() {

      alert(
        'GASスクリプトの読み込みに失敗しました'
      );

    };


  document.body.appendChild(script);

</script>

</body>

</html>
```
