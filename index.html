<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>GAS通信テスト</title>

</head>

<body>

  <h1>GAS通信テスト</h1>

  <p id="status">
    通信を確認しています…
  </p>

  <pre id="result"></pre>


  <script>

    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbzRtkR5QMaKLnkxtJsN2qnmQxbCYY0qqtd77c7hKFSXuOx_3XDHDnl0C5jsYSrCuAl1/exec';


    const callbackName =
      'gasTestCallback';


    window[callbackName] =
      function(data) {

        document.getElementById('status').textContent =
          'GASとの通信に成功しました。';

        document.getElementById('result').textContent =
          JSON.stringify(
            data,
            null,
            2
          );

      };


    const script =
      document.createElement('script');


    script.src =
      GAS_URL +
      '?api=jsonp&callback=' +
      callbackName +
      '&_=' +
      Date.now();


    script.onerror =
      function() {

        document.getElementById('status').textContent =
          'GASとの通信に失敗しました。';

      };


    document.body.appendChild(script);

  </script>

</body>

</html>
