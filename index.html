<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>実包・狩猟管理</title>

</head>

<body>

  <h1>実包・狩猟管理</h1>

  <p id="status">
    GASからデータを取得しています…
  </p>

  <h2>現在庫</h2>

  <div id="stock">
    読み込み中…
  </div>


  <script>

    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbzRtkR5QMaKLnkxtJsN2qnmQxbCYY0qqtd77c7hKFSXuOx_3XDHDnl0C5jsYSrCuAl1/exec';


    <script>

  const GAS_URL =
    'ここにGASのウェブアプリURL';


  function testCallback(data) {

    if (!data || !data.success) {

      document.getElementById('status').textContent =
        'データ取得に失敗しました。';

      return;

    }


    document.getElementById('status').textContent =
      'GASとの通信：OK';


    const stock =
      data.stock || {};


    const stockArea =
      document.getElementById('stock');


    stockArea.innerHTML = '';


    const types =
      Object.keys(stock);


    if (types.length === 0) {

      stockArea.textContent =
        '在庫データがありません。';

      return;

    }


    types.forEach(function(type) {

      const div =
        document.createElement('div');

      div.textContent =
        type + '：' +
        stock[type] +
        '発';

      div.style.fontSize = '24px';
      div.style.marginBottom = '12px';

      stockArea.appendChild(div);

    });

  }


  const script =
    document.createElement('script');


  script.src =
  GAS_URL +
  '?api=jsonp&callback=testCallback&_=' +
  Date.now();


  script.onerror =
    function() {

      document.getElementById('status').textContent =
        'GASとの通信に失敗しました。';

    };


  document.body.appendChild(script);

</script>

  </script>

</body>

</html>
