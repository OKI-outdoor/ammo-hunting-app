```html
<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>実包・狩猟管理</title>

</head>

<body>

  <h1>実包・狩猟管理</h1>

  <h2>現在庫</h2>

  <div id="stock">
    読み込み中…
  </div>


  <script>

  const API_URL =
    'https://ammo-gas-api.kikorinmura.workers.dev';

  fetch(API_URL)
    .then(function(response) {

      if (!response.ok) {
        throw new Error(
          'HTTPエラー: ' + response.status
        );
      }

      return response.json();

    })
    .then(function(data) {

      alert(
        'GASからデータを受信しました！'
      );

      document.getElementById('stock')
        .textContent =
        JSON.stringify(data, null, 2);

    })
    .catch(function(error) {

      alert(
        'GASスクリプトの読み込みに失敗しました\n' +
        error.message
      );

    });

</script>

</body>

</html>
```
